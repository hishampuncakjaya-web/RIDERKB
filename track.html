<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyRiderKu V40 - Penjejakan Langsung | Leaflet Maps</title>
    <link rel="stylesheet" href="app.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body class="bg-dark text-light">
    <header class="glass-header sticky top-0 z-50 px-4 py-3 flex justify-between items-center border-b border-gold/20">
        <div class="flex items-center space-x-3">
            <div class="bg-gold text-dark font-black px-3 py-1.5 rounded-lg text-lg">TRK</div>
            <div>
                <h1 class="font-bold text-sm text-gold">PENJEJAKAN LIVE</h1>
                <p class="text-[10px] text-gray-400">Kota Bharu, Kelantan</p>
            </div>
        </div>
        <a href="index.html" class="text-xs bg-dark-card border border-gold/30 text-gold px-3 py-1.5 rounded-lg">Utama</a>
    </header>

    <main class="max-w-md mx-auto p-4 pb-24">
        <div class="bg-dark-card border border-gold/30 rounded-2xl p-4 mb-4">
            <h3 class="text-xs font-bold text-gold uppercase tracking-wider mb-2">Status Pesanan #MRK-8842</h3>
            <div class="flex items-center space-x-3 text-xs text-gray-300">
                <div class="w-8 h-8 rounded-full bg-gold text-dark flex items-center justify-center font-bold">2</div>
                <div>
                    <strong class="text-light block">Rider Sedang Menuju ke Lokasi Anda</strong>
                    <span class="text-gray-400">Anggaran Masa Ketibaan: 8 minit</span>
                </div>
            </div>
        </div>

        <!-- Map Container -->
        <div id="map" class="w-full h-96 rounded-2xl border border-gold/30 shadow-2xl"></div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-dark-card border-t border-gold/20 py-2 px-6 flex justify-between items-center z-50 max-w-md mx-auto">
        <a href="index.html" class="text-gray-400 hover:text-gold flex flex-col items-center text-xs"><i class="fas fa-home text-base"></i> Utama</a>
        <a href="track.html" class="text-gold flex flex-col items-center text-xs"><i class="fas fa-map-marked-alt text-base"></i> Jejak</a>
        <a href="rider.html" class="text-gray-400 hover:text-gold flex flex-col items-center text-xs"><i class="fas fa-motorcycle text-base"></i> Rider</a>
        <a href="admin.html" class="text-gray-400 hover:text-gold flex flex-col items-center text-xs"><i class="fas fa-user-shield text-base"></i> Admin</a>
    </nav>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([6.1254, 102.2381], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        L.marker([6.1254, 102.2381]).addTo(map)
            .bindPopup('<b>Lokasi Anda</b><br>Kota Bharu, Kelantan')
            .openPopup();
    </script>
</body>
</html>
