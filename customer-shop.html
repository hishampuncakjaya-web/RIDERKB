<style>
.shop{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.shop.off{opacity:.55}
.it{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
.it:last-child{border:0}.it .nm{font-weight:700}
.qty{display:flex;align-items:center;gap:8px;flex:0 0 auto}.qty b{min-width:22px;text-align:center}
.qty button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font:inherit;font-size:20px;font-weight:800}
.qty button:disabled{opacity:.35}
#cartbar{position:fixed;left:0;right:0;bottom:0;z-index:1000;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
#cartbar .btn{width:100%}
label.l{display:block;font-size:14px;font-weight:600;margin:12px 0 6px}
input.f,textarea.f{width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:14px;padding:13px;font:inherit}
.opts{display:flex;gap:10px}.opts button{flex:1;padding:13px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--txt);font:inherit;font-weight:600}
.opts button.on{border-color:var(--gold,#a3e635);color:var(--gold,#a3e635)}
.star{background:none;border:0;font-size:28px;opacity:.35;padding:4px}.star.on{opacity:1}
body{padding-bottom:90px}

</head><body class="role-customer">
<div class="wrap">
<header class="hd"><div><span class="tag">MARKETPLACE</span><h1 id="ttl">Kedai MYRIDERKU</h1><div class="sm" id="sub">Pesan terus dari kedai rakan kami</div></div><a class="hbtn" href="customer.html">‹ Utama</a></header>
<div class="pad"><div id="v"><div class="card mut">Memuatkan…</div></div></div>
</div>

<div id="toast" class="toast hide"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>RKB.gateInstall('MYRIDERKU');RKB.customerTabs('kedai')</script>
<script>
const $=s=>document.querySelector(s), {esc,rm,r2}=RKB;
const Q=new URLSearchParams(location.search);
const ST_L={baru:'🆕 Menunggu kedai terima',diterima:'👨‍🍳 Kedai sedang sediakan',siap:'✅ Siap! Boleh diambil',selesai:'🎉 Selesai',ditolak:'❌ Ditolak kedai',batal:'🚫 Dibatalkan'};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.remove('hide');clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.add('hide'),3500)}
const view=h=>{ $('#v').innerHTML=h; scrollTo({top:0}) };
const base=m=>(m.pp!=null&&+m.pp<+m.p)?+m.pp:+m.p;          // harga vendor (apa yang vendor terima)
let shops={}, uid=null, shop=null, menu={}, cart={}, off=null, geo=null;
const SK='rkb-vlast';
/* ---- Upah rider: RM5 untuk 5 KM pertama; RM1 bagi setiap KM tambahan ---- */
const PR=Object.freeze({base:5,perKm:1});
/* POLISI: RM5.00 meliputi 5 KM pertama. Selepas itu RM1.00/KM tambahan; tiada pembundaran tambang. */
const FREE_KM=5;
const feeOf=km=>+(PR.base+Math.max(0,+(+km).toFixed(1)-FREE_KM)*PR.perKm).toFixed(2);
async function geocodeAddr(q){ try{ const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=my&viewbox=102.0,6.4,102.5,5.9&q='+encodeURIComponent(/kelantan/i.test(q)?q:q+', Kota Bharu, Kelantan')); const j=await r.json(); return j[0]?[+(+j[0].lat).toFixed(6),+(+j[0].lon).toFixed(6)]:null }catch(_){ return null } }
let quote=null, QM='ambil', qSeq=0;
async function getQuote(){
  const my=++qSeq, ft=$('#feeT'), sc=(shop&&shop.lat!=null&&shop.lng!=null)?[+shop.lat,+shop.lng]:null;
  quote=null; refreshFee();
  if(!sc){ if(ft) ft.textContent='Kedai ini belum tetapkan lokasi, jadi upah rider tak dapat dikira. Sila pilih ambil sendiri.'; return }
  const addr=$('#addr')?$('#addr').value.trim():''; let pt=geo;
  if(!pt&&addr){ if(ft) ft.textContent='Mencari lokasi alamat…'; pt=await geocodeAddr(addr); if(my!==qSeq) return; if(pt) geo=pt }
  if(!pt){ if(ft) ft.textContent='Lokasi belum dapat dikesan. Tekan “Guna lokasi saya” atau taip alamat lebih jelas.'; return }
  let km, est=false; try{ const rt=await RKB.getRoute(sc,pt); if(rt) km=rt.distance/1000 }catch(_){}
  if(km==null){ km=RKB.hav(sc,pt)*1.3; est=true }
  if(my!==qSeq) return;
  km=+km.toFixed(1); quote={km,fee:feeOf(km),est}; if(ft) ft.textContent='Upah rider dikira ikut jarak dari kedai ke lokasi anda. Satu order, satu bayaran.';
  refreshFee();
}
const SMALL_MIN=10, SMALL_FEE=0;                 // dimansuhkan: polisi baharu guna markup RM1/unit (bawah RM10). Order lama yang ada caj kecil masih dipaparkan betul
const smallOf=t=>t<SMALL_MIN?SMALL_FEE:0;
function refreshFee(){
  const r=$('#feeRow'), g=$('#go'); if(!r||!g||g.disabled) return; const s=sums(), sm=smallOf(s.total), hq=QM==='hantar'&&quote, tot=r2(s.total+sm+(hq?quote.fee:0));
  let h=''; if(sm) h+=`<div class="row"><span>Caj pesanan kecil <small class="mut">(bawah ${rm(SMALL_MIN)})</small></span><span>${rm(sm)}</span></div>`;
  if(hq) h+=`<div class="row"><span>🛵 Upah rider <small class="mut">(${quote.km} km${quote.est?', anggaran':''})</small></span><span>${rm(quote.fee)}</span></div>`;
  if(sm||hq) h+=`<div class="row"><span><b>Jumlah bayar</b></span><span><b>${rm(tot)}</b></span></div>`;
  r.innerHTML=h; g.textContent='🛒 Hantar pesanan · '+rm(tot);
}
/* Upah/KM/caj kecil disimpan dalam teks nota (medan order sedia ada) supaya tak ditolak oleh rules Firebase */
const TAGRE=/\[#U=([\d.]+);K=([\d.]+);S=([\d.]+)\]\s?/;
function ext(o){ const m=String(o.notes||'').match(TAGRE); if(!m) return o; return {...o,notes:String(o.notes).replace(TAGRE,''),fee:o.addr?+m[1]:undefined,km:+m[2],small:+m[3]} }

if(!RKB.ok){ view('<div class="card">Sistem belum tersedia. Sila cuba sebentar lagi.</div>') }
else RKB.loadShares().then(()=>{ const v=Q.get('v'), o=Q.get('o'); if(v&&o) track(v,o); else home() });

/* ---------- Senarai kedai ---------- */
async function home(){
  cart={}; $('#cartbar').classList.add('hide'); $('#ttl').textContent='Kedai MYRIDERKU';
  view('<div class="card mut">Memuatkan kedai…</div>');
  let last=null; try{ last=JSON.parse(localStorage.getItem(SK)||'null') }catch(_){}
  try{ shops=(await RKB.db.ref('vshops').once('value')).val()||{} }catch(e){ view('<div class="card">Tak dapat memuatkan kedai. Semak internet dan cuba lagi.<div class="acts"><button class="btn" onclick="home()">🔄 Cuba lagi</button></div></div>'); return }
  const E=Object.entries(shops).sort((a,b)=>(!!b[1].open-!!a[1].open)||String(a[1].name).localeCompare(String(b[1].name)));
  let activeCat='Semua', query='';
  const cats=['Semua','Makanan & Minuman','Runcit & Mini Mart','Fesyen & Pakaian','Kecantikan & Penjagaan Diri','Kesihatan & Farmasi','Elektronik & Telefon','Hardware & Perkakasan','Automotif & Alat Ganti','Pertanian & Hasil Kampung','Hadiah & Bunga','Dobi & Cucian','Servis & Pembaikan','Lain-lain'];
  const draw=()=>{
    const filtered=E.filter(([u,s])=>(activeCat==='Semua'||String(s.cat||'').toLowerCase()===activeCat.toLowerCase())&&(!query||[s.name,s.cat,s.addr,s.desc].join(' ').toLowerCase().includes(query)));
    let h=`<div class="card"><label class="l" for="bizSearch">Cari perniagaan, produk atau servis</label><input class="f" id="bizSearch" placeholder="Contoh: nasi kerabu, bengkel, dobi..." value="${esc(query)}"><div class="mut" style="margin-top:8px">${E.length} perniagaan dalam direktori MYRIDERKU</div></div><div class="card" style="display:flex;gap:7px;overflow:auto;padding:10px">${cats.map(c=>`<button type="button" class="btn ${c===activeCat?'':'gry'} sm" data-cat="${esc(c)}" style="white-space:nowrap;flex:0 0 auto">${esc(c)}</button>`).join('')}</div>`;
    if(last) h+=`<a class="card" href="customer-shop.html?v=${encodeURIComponent(last.v)}&o=${encodeURIComponent(last.o)}" style="display:block;text-decoration:none;border-color:#3b82f6">📡 <b>Order kedai anda</b> · tekan untuk lihat status</a>`;
    h+=filtered.length?filtered.map(([u,s])=>`<button class="card shop ${s.open?'':'off'}" data-u="${esc(u)}" type="button"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(s.name)}</b><span class="badge">${s.open?'🟢 Buka':'🔴 Tutup'}</span></div><div class="mut">${esc(s.cat||'')}${s.addr?' · '+esc(s.addr):''}</div>${s.businessType?`<div class="mut">${s.businessType==='rumah'?'Perniagaan dari rumah':s.businessType==='individu'?'Penyedia servis':'Kedai fizikal'}</div>`:''}${s.promo?`<div style="margin-top:4px">🏷️ ${esc(s.promo)}</div>`:''}${s.desc?`<div class="mut" style="margin-top:4px">${esc(s.desc)}</div>`:''}</button>`).join(''):'<div class="card mut" style="text-align:center">Tiada perniagaan dalam carian ini. Cuba kategori atau kata kunci lain.</div>';
    view(h);
    const inp=$('#bizSearch'); if(inp){inp.oninput=()=>{query=inp.value.trim().toLowerCase();const y=scrollY;draw();scrollTo(0,y)}}
    $('#v').onclick=e=>{const c=e.target.closest('[data-cat]');if(c){activeCat=c.dataset.cat;draw();return}const b=e.target.closest('.shop');if(b)openShop(b.dataset.u)};
  }; draw();
}
window.home=home;

/* ---------- Menu ---------- */
async function openShop(u){
  const s=shops[u]; if(!s) return; if(!s.open){ toast('Kedai ini sedang tutup.'); return }
  uid=u; shop=s; cart={}; $('#ttl').textContent=s.name;
  view('<div class="card mut">Memuatkan menu…</div>');
  try{ menu=(await RKB.db.ref('vmenu/'+u).once('value')).val()||{} }catch(e){ toast('Tak dapat memuatkan menu.'); home(); return }
  drawMenu();
}
const items=()=>Object.entries(menu).filter(([k,m])=>m&&m.on!==false&&m.n).sort((a,b)=>String(a[1].c||'~').localeCompare(String(b[1].c||'~'))||String(a[1].n).localeCompare(String(b[1].n)));
function sums(){ let sub=0, total=0, markup=0,n=0; Object.entries(cart).forEach(([k,q])=>{ const m=menu[k]; if(m){ const unit=base(m), customer=RKB.vPrice(unit); sub+=unit*q; total+=customer*q; markup+=(customer-unit)*q; n+=q } }); sub=r2(sub); markup=r2(markup); total=r2(total); return {sub,markup,n,total} }
function drawMenu(){
  const I=items(); let cat=null, h=`<button class="btn gry sm" id="bk" type="button">‹ Semua kedai</button><div class="card"><div class="mut">${esc(shop.addr||'')}</div>${shop.promo?`<div>🏷️ ${esc(shop.promo)}</div>`:''}</div>`;
  h+=I.length?'<div class="card">'+I.map(([k,m])=>{ const out=m.st===0, q=cart[k]||0, max=m.st>0?Math.min(99,m.st):99, pr=RKB.vPrice(base(m)), was=(m.pp!=null&&+m.pp<+m.p)?RKB.vPrice(+m.p):0;
    return `<div class="it">${m.img&&m.img[0]?`<img src="${esc(m.img[0])}" alt="${esc(m.n)}" loading="lazy" style="width:76px;height:76px;object-fit:cover;border-radius:12px;flex:0 0 76px">`:``}<div style="min-width:0"><div class="nm">${esc(m.n)}</div>${m.d?`<div class="mut">${esc(m.d)}</div>`:''}<div>${was?`<s class="mut">${rm(was)}</s> `:''}<b>${rm(pr)}</b>${out?' · <b style="color:#ef4444">HABIS</b>':m.st>0&&m.st<=5?` · <span class="mut">tinggal ${esc(m.st)}</span>`:''}</div></div>
    <div class="qty">${out?'':`<button data-k="${esc(k)}" data-d="-1" type="button" ${q?'':'disabled'} aria-label="Kurang">−</button><b>${q}</b><button data-k="${esc(k)}" data-d="1" type="button" ${q>=max?'disabled':''} aria-label="Tambah">+</button>`}</div></div>` }).join('')+'</div>':'<div class="card mut">Kedai ini belum ada menu.</div>';
  view(h); cartBar();
  $('#bk').onclick=home;
  $('#v').onclick=e=>{ const b=e.target.closest('button[data-k]'); if(!b||b.disabled) return; const k=b.dataset.k, q=Math.max(0,(cart[k]||0)+(+b.dataset.d)); if(q) cart[k]=q; else delete cart[k]; const y=scrollY; drawMenu(); scrollTo({top:y}) };
}
function cartBar(){ const s=sums(), b=$('#cartbar'); b.classList.toggle('hide',!s.n); $('#cartGo').textContent=`🛒 ${s.n} item · ${rm(s.total)} · Semak & pesan`; $('#cartGo').onclick=checkout }

/* ---------- Pesan ---------- */
const phoneOk=v=>{ let d=String(v).replace(/\D/g,''); if(d.startsWith('60')) d='0'+d.slice(2); return /^01\d{8,9}$/.test(d)||/^0[3-9]\d{7,8}$/.test(d) };
function checkout(){
  const s=sums(); if(!s.n) return; $('#cartbar').classList.add('hide');
  let nm='',ph=''; try{ const d=JSON.parse(localStorage.getItem('rkb')||'null')||{}; nm=d.n||''; ph=d.p||'' }catch(_){}
  let mode='ambil', pay='cash';
  const lines=Object.entries(cart).map(([k,q])=>{const unit=base(menu[k]),customer=RKB.vPrice(unit);return `<div class="row checkout-item"><span>${q}× ${esc(menu[k].n)}</span><strong>${rm(customer*q)}</strong></div>`}).join('');
  view(`<button class="btn gry sm" id="bk" type="button">‹ Ubah pesanan</button>
  <div class="card checkout-summary"><div class="big">${esc(shop.name)}</div><div class="checkout-lines">${lines}</div><div class="checkout-total"><span>Jumlah produk</span><strong>${rm(s.total)}</strong></div><div id="feeRow"></div></div>
  <div class="card"><div class="big">Cara terima</div><div class="opts" id="mode" style="margin-top:8px"><button class="on" data-m="ambil" type="button">🚶 Ambil sendiri</button><button data-m="hantar" type="button">🛵 Hantar (rider)</button></div>
  <div id="addrBox" class="hide"><label class="l">Alamat hantar</label><input class="f" id="addr" maxlength="200" placeholder="No rumah, taman, kawasan"><div class="acts"><button class="btn gry sm" id="gps" type="button">📍 Guna lokasi saya</button></div><div class="mut" id="gpsT"></div><div class="mut" id="feeT" style="margin-top:6px">Upah rider dikira ikut jarak dari kedai ke lokasi anda. Satu order, satu bayaran. Rider dipanggil automatik bila kedai terima.</div></div></div>
  <div class="card"><label class="l" style="margin-top:0">Nama</label><input class="f" id="nm" maxlength="60" value="${esc(nm)}" autocomplete="name"><label class="l">No. telefon</label><input class="f" id="ph" type="tel" inputmode="tel" maxlength="20" value="${esc(ph)}" placeholder="0123456789" autocomplete="tel"><label class="l">Catatan (pilihan)</label><textarea class="f" id="nt" maxlength="200" rows="2" placeholder="Cth: kurang pedas"></textarea>
  <div class="big" style="margin-top:12px">Bayaran</div><div class="opts" id="pay" style="margin-top:8px"><button class="on" data-p="cash" type="button">💵 Tunai</button><button data-p="online" type="button">📲 Transfer / QR</button></div></div>
  <div class="err" id="err" style="color:#fda4af;min-height:20px"></div><button class="btn full" id="go" type="button">🛒 Hantar pesanan · ${rm(s.total)}</button>`);
  $('#bk').onclick=drawMenu;
  $('#mode').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; mode=b.dataset.m; QM=mode; [...$('#mode').children].forEach(x=>x.classList.toggle('on',x===b)); $('#addrBox').classList.toggle('hide',mode!=='hantar'); if(mode==='hantar'&&(geo||$('#addr').value.trim())&&!quote) getQuote(); else refreshFee() };
  $('#pay').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; pay=b.dataset.p; [...$('#pay').children].forEach(x=>x.classList.toggle('on',x===b)) };
  geo=null; quote=null; QM='ambil'; qSeq++;
  $('#addr').addEventListener('change',()=>{ geo=null; getQuote() });
  $('#gps').onclick=()=>{ if(!navigator.geolocation){ $('#gpsT').textContent='Peranti tak sokong lokasi.'; return } $('#gpsT').textContent='Mengesan…'; navigator.geolocation.getCurrentPosition(p=>{ geo=[+p.coords.latitude.toFixed(6),+p.coords.longitude.toFixed(6)]; $('#gpsT').textContent='✅ Lokasi dikesan'; if(!$('#addr').value.trim()) $('#addr').value='Lokasi GPS saya ('+geo.join(', ')+')'; getQuote() },()=>{ $('#gpsT').textContent='Tak dapat akses lokasi. Taip alamat sahaja.' },{enableHighAccuracy:true,timeout:12000}) };
  $('#go').onclick=()=>place({get mode(){return mode},get pay(){return pay}},s); refreshFee();
}
async function place(st,s){
  const err=t=>{ $('#err').textContent=t }, nm=$('#nm').value.trim(), ph=$('#ph').value.trim(), addr=($('#addr')?$('#addr').value.trim():'');
  if(!nm) return err('Isi nama anda.'); if(!phoneOk(ph)) return err('Nombor telefon nampak tak betul. Contoh: 0123456789');
  if(st.mode==='hantar'&&!addr) return err('Isi alamat hantar.');
  if(st.mode==='hantar'){ if(!quote||!geo){ err('Mengira upah rider…'); await getQuote() } if(!quote||!geo) return err('Upah rider belum dapat dikira. Tekan “Guna lokasi saya” atau taip alamat lebih jelas.'); err('') }
  try{ const w=30000-(Date.now()-(+localStorage.getItem('rkb-lastsend')||0)); if(w>0) return err('Sila tunggu '+Math.ceil(w/1000)+' saat sebelum hantar lagi.') }catch(_){}
  const b=$('#go'); b.disabled=true; b.textContent='⏳ Menghantar…'; err('');
  // semak semula: kedai masih buka & stok mencukupi
  try{
    const [o,m]=await Promise.all([RKB.db.ref('vshops/'+uid+'/open').once('value'),RKB.db.ref('vmenu/'+uid).once('value')]);
    if(o.val()!==true){ b.disabled=false; refreshFee(); return err('Maaf, kedai baru sahaja tutup.') }
    menu=m.val()||{}; const bad=Object.entries(cart).find(([k,q])=>{ const x=menu[k]; return !x||x.on===false||x.st===0||(x.st>0&&q>x.st) });
    if(bad){ b.disabled=false; refreshFee(); toast('Stok berubah, sila semak semula pesanan.'); drawMenu(); return }
  }catch(e){}
  const S2=sums(), id=RKB.newId(), ref='KDI-'+id.slice(0,4).toUpperCase(), TS=firebase.database.ServerValue.TIMESTAMP, its={};
  Object.entries(cart).forEach(([k,q],i)=>{ const m=menu[k]; its['i'+i]={n:String(m.n).slice(0,60),q,p:r2(base(m)),id:k.slice(0,40)} });
  const SM=smallOf(S2.total), hq=st.mode==='hantar'&&quote, tag=`[#U=${hq?quote.fee.toFixed(2):'0.00'};K=${hq?quote.km:0};S=${SM.toFixed(2)}] `;
  const note=(st.mode==='hantar'?'[HANTAR] ':'[AMBIL SENDIRI] ')+tag+$('#nt').value.trim();
  const od={ref,createdAt:TS,name:nm.slice(0,60),phone:ph.slice(0,20),phoneKey:RKB.phoneKey(ph),items:its,sub:S2.sub,markup:S2.markup,total:S2.total,pricingPolicy:'vendor_full_price_plus_platform_markup_v1',status:'baru',pay:st.pay,notes:note.slice(0,300)};
  if(st.mode==='hantar'){ od.addr=addr.slice(0,200); if(geo){ od.lat=geo[0]; od.lng=geo[1] } }
  const up={}; up['vorders/'+uid+'/'+id]=od; up['ratelimit/'+od.phoneKey]=TS;
  try{
    await Promise.race([RKB.db.ref().update(up),new Promise((_,r)=>setTimeout(()=>r({code:'TIMEOUT'}),9000))]);
    try{ localStorage.setItem('rkb',JSON.stringify({n:nm,p:ph})); localStorage.setItem('rkb-lastsend',String(Date.now())); localStorage.setItem(SK,JSON.stringify({v:uid,o:id})) }catch(_){}
    track(uid,id);
  }catch(e){
    // tulisan tertunda mungkin sudah sampai
    try{ const ex=await Promise.race([RKB.db.ref('vorders/'+uid+'/'+id+'/ref').once('value'),new Promise((_,r)=>setTimeout(r,4000))]); if(ex&&ex.exists()){ try{ localStorage.setItem(SK,JSON.stringify({v:uid,o:id})) }catch(_){} track(uid,id); return } }catch(_){}
    b.disabled=false; refreshFee();
    err(e&&e.code==='TIMEOUT'?'⚠️ Talian lemah. Pesanan belum masuk, tekan sekali lagi.':e&&e.code==='PERMISSION_DENIED'?'⚠️ Sistem tidak membenarkan pesanan ini. Sila hubungi Admin untuk semakan.':'⚠️ Sambungan bermasalah. Tekan sekali lagi.');
  }
}

/* ---------- Panggil rider automatik (pickup = kedai, drop = lokasi semasa order) ---------- */
const DS={};
async function dispatchRider(id,o,sh){
  if(DS[id]==='busy'||DS[id]==='ok') return; DS[id]='busy';
  const done=v=>{ DS[id]=v; if(window.__redraw) window.__redraw() };
  try{
    let ex=null; try{ ex=await RKB.db.ref('orders/'+id+'/ref').once('value') }catch(_){}
    if(ex&&ex.exists()){ return done('ok') }
    let g=null; try{ g=await RKB.ensureGuestAuth() }catch(_){}
    const TS=firebase.database.ServerValue.TIMESTAMP, cash=o.pay==='cash', minCash=+(RKB.cfg.walletMinCash??0), pk=RKB.phoneKey(o.phone||'');
    if(!pk) return done('fail');
    const order={ref:'RKB-'+id.slice(0,4).toUpperCase(),createdAt:TS,status:'baru',...(g?{customerUid:g.uid}:{}),service:'Tapau Makanan',vehicle:'Motor',
      pick:{lat:+sh.lat,lng:+sh.lng,addr:(sh.name+(sh.addr?', '+sh.addr:'')).slice(0,200)},drop:{lat:+o.lat,lng:+o.lng,addr:String(o.addr).slice(0,200)},
      notes:('Ambil pesanan kedai '+sh.name+' #'+o.ref+(cash?' (KUTIP TUNAI '+rm(r2(o.total+(o.small||0)+(+o.fee||0)))+' daripada customer: produk '+rm(o.total)+' + upah '+rm(o.fee)+')':' (sudah dibayar online, tiada kutipan)')).slice(0,600),name:String(o.name||'').slice(0,60),km:+o.km||0,rain:false,price:+o.fee,pay:o.pay,itemEst:0,need:cash?r2(RKB.platCut({price:+o.fee})+minCash):0};
    const up={}; up['orders/'+id]=order; up['orderContacts/'+id]={phone:String(o.phone).slice(0,20),phoneKey:pk}; up['ratelimit/'+pk]=TS;
    await Promise.race([RKB.db.ref().update(up),new Promise((_,r)=>setTimeout(()=>r({code:'TIMEOUT'}),9000))]);
    done('ok');
  }catch(e){
    console.error('dispatch',e);
    try{ const ex=await RKB.db.ref('orders/'+id+'/ref').once('value'); if(ex&&ex.exists()) return done('ok') }catch(_){}
    done('fail');
  }
}

/* ---------- Status pesanan ---------- */
function track(u,id){
  $('#cartbar').classList.add('hide'); $('#ttl').textContent='Status pesanan'; if(off) off();
  view('<div class="card mut">Memuatkan pesanan…</div>');
  let sh=null, payD=null, rated=false;
  RKB.db.ref('vshops/'+u).once('value').then(s=>{ sh=s.val(); if(cur) draw(cur) }).catch(()=>{});
  RKB.readPublicPayment().then(v=>{ payD=v; if(cur) draw(cur) }).catch(()=>{});
  window.__redraw=()=>{ if(cur) draw(cur) };
  let cur=null; const ref=RKB.db.ref('vorders/'+u+'/'+id), cb=s=>{ cur=s.val(); if(!cur){ view('<div class="card">Pesanan tak dijumpai.<div class="acts"><a class="btn" href="customer-shop.html">Ke senarai kedai</a></div></div>'); return } draw(cur) };
  ref.on('value',cb,()=>view('<div class="card">Tak dapat membaca pesanan. Cuba lagi.</div>')); off=()=>ref.off('value',cb);
  function draw(o){
    o=ext(o);
    const its=Object.values(o.items||{}).map(i=>`<div class="row"><span>${esc(i.q)}× ${esc(i.n)}</span><span>${rm((+i.p||0)*(+i.q||0))}</span></div>`).join('');
    const fin=['selesai','ditolak','batal'].includes(o.status); if(fin){ try{ const l=JSON.parse(localStorage.getItem(SK)||'null'); if(l&&l.o===id) localStorage.removeItem(SK) }catch(_){} }
    let h=`<div class="card"><div class="mut">#${esc(o.ref)} · ${esc(sh?sh.name:'')}</div><div class="big">${esc(ST_L[o.status]||o.status)}</div>${o.status==='diterima'&&o.prep?`<div class="mut">Anggaran siap ≈ ${esc(o.prep)} minit</div>`:''}${o.reason?`<div class="mut">Sebab: ${esc(o.reason)}</div>`:''}</div>`;
    h+=`<div class="card">${its}<div class="row"><span><b>${(o.fee!=null||o.small>0)?'Jumlah produk':'Jumlah'}</b></span><span><b>${rm(o.total)}</b></span></div>${o.small>0?`<div class="row"><span>Caj pesanan kecil</span><span>${rm(o.small)}</span></div>`:''}${o.fee!=null?`<div class="row"><span>🛵 Upah rider</span><span>${rm(o.fee)}</span></div>`:''}${(o.fee!=null||o.small>0)?`<div class="row"><span><b>Jumlah bayar</b></span><span><b>${rm(r2(o.total+(o.small||0)+(o.fee||0)))}</b></span></div>`:''}<div class="row"><span>Bayaran</span><span>${o.pay==='cash'?'Tunai':'Transfer / QR'}</span></div>${o.notes?`<div class="row"><span>Catatan</span><span>${esc(o.notes)}</span></div>`:''}${o.addr?`<div class="row"><span>Hantar ke</span><span>${esc(o.addr)}</span></div>`:''}</div>`;
    if(o.pay==='online'&&!fin&&payD&&(payD.acc||payD.qr)) h+=`<div class="card"><div class="big">📲 Bayar ${rm(r2(o.total+(o.small||0)+(o.fee||0)))}</div><div style="margin-top:6px;line-height:1.7">${payD.bank?esc(payD.bank)+'<br>':''}${payD.acc?'No. akaun: <b>'+esc(payD.acc)+'</b><br>':''}${payD.name?'Nama: '+esc(payD.name):''}</div>${payD.qr&&/^data:image\//.test(payD.qr)?`<img alt="QR bayaran" src="${esc(payD.qr)}" style="display:block;max-width:240px;width:100%;margin:10px auto 0;border-radius:12px;background:#fff">`:''}</div>`;
    const auto=o.fee!=null&&o.lat!=null&&o.addr&&sh&&sh.lat!=null;
    if(auto&&['diterima','siap'].includes(o.status)){
      if(!DS[id]) dispatchRider(id,o,sh);
      h+=DS[id]==='ok'?`<div class="card">🛵 <b>Rider sedang dicari / dalam perjalanan.</b> Tiada apa-apa lagi untuk anda buat.<div class="acts"><a class="btn gry" href="customer-track.html?id=${encodeURIComponent(id)}">📡 Jejak rider</a></div></div>`:DS[id]==='fail'?`<div class="card">⚠️ Rider belum berjaya dipanggil.<div class="acts"><button class="btn full" id="rd" type="button">🔁 Cuba panggil rider</button></div></div>`:`<div class="card mut">⏳ Memanggil rider…</div>`;
    } else if(!auto&&o.addr&&['diterima','siap'].includes(o.status)&&sh&&sh.lat!=null){   /* order lama (tiada upah dalam order): kekal cara lama */
      const p=new URLSearchParams({pk:sh.lat+','+sh.lng,pa:(sh.name+(sh.addr?', '+sh.addr:'')).slice(0,200),da:o.addr,n:('Ambil pesanan kedai '+sh.name+' #'+o.ref+(o.pay==='online'?' (sudah dibayar kepada kedai)':' (bayar kedai: '+rm(o.total)+')')).slice(0,300)}); if(o.lat!=null) p.set('dk',o.lat+','+o.lng);
      h+=`<a class="btn full" style="display:block;text-align:center;text-decoration:none;margin:8px 0" href="customer.html?${p.toString().replace(/\+/g,'%20')}">🛵 Panggil rider hantar</a>`; }
    if(o.status==='baru') h+='<div class="acts"><button class="btn gry full" id="cx" type="button" style="border:1px solid #ef4444">🚫 Batalkan pesanan</button></div>';
    if(o.status==='selesai'){ h+=o.rating?`<div class="card"><div class="big">Terima kasih! ${'⭐'.repeat(+o.rating.stars||0)}</div></div>`:'<div class="card"><div class="big">Macam mana pesanan tadi?</div><div id="stars">'+[1,2,3,4,5].map(n=>`<button class="star" data-n="${n}" type="button">⭐</button>`).join('')+'</div></div>'; }
    h+='<div class="acts"><a class="btn gry" href="customer-shop.html">🏪 Semua kedai</a><a class="btn gry" href="customer.html">🛵 Hantar barang</a></div>';
    view(h);
    const rd=$('#rd'); if(rd) rd.onclick=()=>{ DS[id]=null; dispatchRider(id,ext(cur),sh) };
    const cx=$('#cx'); if(cx) cx.onclick=async()=>{ if(!confirm('Batalkan pesanan ini?')) return; cx.disabled=true; try{ await ref.child('status').set('batal') }catch(e){ toast('Tak dapat batal: kedai mungkin baru terima.'); cx.disabled=false } };
    const st=$('#stars'); if(st) st.onclick=async e=>{ const b=e.target.closest('.star'); if(!b||rated) return; rated=true; try{ await ref.child('rating').set({stars:+b.dataset.n,t:Date.now()}) }catch(_){ rated=false; toast('Tak dapat hantar penilaian.') } };
  }
}
if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
