<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyRiderKu - Portal Pelanggan</title>
    <link rel="stylesheet" href="myriderku-ceria.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <div class="app-header">
        <h2>🛵 MyRiderKu Pelanggan</h2>
    </div>
    <div class="container my-3">
        <div class="card p-3 mb-3">
            <h3>Maklumat Penghantaran</h3>
            <form id="order-form">
                <div class="mb-3">
                    <label>Nama Penuh</label>
                    <input type="text" id="customer-name" class="form-control" value="Mohammad Norhisham Jusoh" required>
                </div>
                <div class="mb-3">
                    <label>No. Telefon</label>
                    <input type="text" id="customer-phone" class="form-control" value="+60199291119" required>
                </div>
                <div class="mb-3">
                    <label>Alamat Penuh / Lokasi</label>
                    <input type="text" id="customer-address" class="form-control" placeholder="No. rumah, nama jalan, taman/kampung" required>
                </div>
                <div class="mb-3">
                    <label>Catatan (Pilihan)</label>
                    <textarea id="order-notes" class="form-control" placeholder="Cth: Kurang pedas"></textarea>
                </div>
                <div class="mb-3">
                    <button type="button" id="btn-auto-location" class="btn btn-outline-primary btn-sm">📍 Dapatkan Lokasi Semasa (GPS)</button>
                    <span id="coordinates-output" class="text-muted small ms-2">Koordinat: 6.101185, 102.207195</span>
                </div>
                <button type="submit" id="btn-submit-order" class="btn btn-warning w-100 py-3 font-weight-bold">🛒 Hantar Pesanan ke WhatsApp (RM 13.00)</button>
            </form>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Auto-detect location with fallback to Kota Bharu center
        window.currentLat = 6.101185;
        window.currentLng = 102.207195;

        document.getElementById('btn-auto-location').addEventListener('click', function() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    window.currentLat = position.coords.latitude;
                    window.currentLng = position.coords.longitude;
                    document.getElementById('coordinates-output').innerText = `Koordinat: ${window.currentLat.toFixed(6)}, ${window.currentLng.toFixed(6)}`;
                    alert("Lokasi GPS berjaya dikesan!");
                }, function(error) {
                    alert("GPS gagal dikesan, menggunakan lokasi lalai Kota Bharu.");
                });
            } else {
                alert("Geolocation tidak disokong pelayar ini.");
            }
        });

        // WhatsApp Deep-Link Free Order Submission with Live Location
        document.getElementById('order-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const customerName = document.getElementById("customer-name").value;
            const customerPhone = document.getElementById("customer-phone").value;
            const customerAddress = document.getElementById("customer-address").value;
            const orderNotes = document.getElementById("order-notes").value;
            const googleMapsLink = `https://maps.google.com/?q=${window.currentLat},${window.currentLng}`;
            
            const adminWhatsAppNumber = "601139900099";
            
            const message = `*TEMPAHAN BARU - MYRIDERKU*\n\n` +
                            `👤 *Nama:* ${customerName}\n` +
                            `📞 *No. Telefon:* ${customerPhone}\n` +
                            `📍 *Alamat:* ${customerAddress}\n` +
                            `🗺️ *Live Location / GPS:* ${googleMapsLink}\n` +
                            `📝 *Nota:* ${orderNotes}\n\n` +
                            `Sahkan pesanan saya ini. Terima kasih!`;
            
            const encodedMessage = encodeURIComponent(message);
            const whatsappUrl = `https://wa.me/${adminWhatsAppNumber}?text=${encodedMessage}`;
            window.open(whatsappUrl, '_blank');
        });
    </script>
</body>
</html>
