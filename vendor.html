<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyRiderKu - Portal Vendor</title>
    <link rel="stylesheet" href="myriderku-ceria.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <div class="container my-4">
        <h2>Kedai / Vendor Portal</h2>
        <div class="card p-3 mt-3">
            <h4>Status Kedai: <span id="shop-status-text" class="text-success">Buka (Available)</span></h4>
            <hr>
            <h5>Lokasi Kedai Pada Peta</h5>
            <div id="vendor-map" style="height: 300px; width: 100%; background: #e5e5e5; border-radius: 8px;"></div>
            <p class="mt-2 text-muted">Koordinat: <span id="coords-display">6.101185, 102.207195</span></p>
        </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            setTimeout(() => {
                const map = L.map('vendor-map').setView([6.101185, 102.207195], 16);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19
                }).addTo(map);
                const marker = L.marker([6.101185, 102.207195], {draggable: true}).addTo(map);
                marker.on('dragend', function(e) {
                    const pos = marker.getLatLng();
                    document.getElementById('coords-display').innerText = `${pos.lat.toFixed(6)}, ${pos.lng.toFixed(6)}`;
                });
            }, 300);
        });
    </script>
</body>
</html>
