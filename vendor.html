<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyRiderKu V40 - Portal Vendor | Pengurusan Menu & Pesanan</title>
    <link rel="stylesheet" href="app.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-dark text-light">
    <header class="glass-header sticky top-0 z-50 px-4 py-3 flex justify-between items-center border-b border-gold/20">
        <div class="flex items-center space-x-3">
            <div class="bg-gold text-dark font-black px-3 py-1.5 rounded-lg text-lg">VND</div>
            <div>
                <h1 class="font-bold text-sm text-gold">PORTAL VENDOR</h1>
                <p class="text-[10px] text-gray-400">ZUS Coffee - Jalan Temenggong</p>
            </div>
        </div>
        <a href="index.html" class="text-xs bg-dark-card border border-gold/30 text-gold px-3 py-1.5 rounded-lg">Utama</a>
    </header>

    <main class="max-w-md mx-auto p-4 pb-24">
        <div class="bg-dark-card border border-gold/30 rounded-2xl p-5 mb-5 shadow-xl">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs text-gray-400">Status Restoran</span>
                <span class="bg-green-500/20 text-green-400 text-xs px-2.5 py-0.5 rounded font-bold">BUKA (Open)</span>
            </div>
            <h2 class="text-xl font-black text-gold">Jumlah Pesanan Hari Ini</h2>
            <div class="text-2xl font-black text-light mt-1">14 Pesanan <span class="text-xs text-gold font-normal">(RM 210.00)</span></div>
        </div>

        <h3 class="text-sm font-bold text-gold uppercase tracking-wider mb-3"><i class="fas fa-utensils mr-2"></i> Pesanan Masuk Semasa</h3>
        <div class="space-y-3">
            <div class="bg-dark-card border border-gold/20 rounded-xl p-4">
                <div class="flex justify-between items-start mb-2">
                    <span class="bg-yellow-500/20 text-yellow-400 text-[10px] px-2 py-0.5 rounded font-bold">Sedang Disediakan</span>
                    <span class="text-xs text-gray-400">12:40 PM</span>
                </div>
                <h4 class="text-xs font-bold text-light mb-1">Spanish Lattes (2x) & Croissant</h4>
                <p class="text-[11px] text-gray-400 mb-3">Pelanggan: Wan Ramlah • Rider: Ahmad</p>
                <button onclick="alert('Pesanan ditanda siap untuk diambil rider!')" class="w-full bg-gold text-dark text-xs font-bold py-2 rounded-lg hover:opacity-90">Tanda Sedia Diambil</button>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-dark-card border-t border-gold/20 py-2 px-6 flex justify-between items-center z-50 max-w-md mx-auto">
        <a href="index.html" class="text-gray-400 hover:text-gold flex flex-col items-center text-xs"><i class="fas fa-home text-base"></i> Utama</a>
        <a href="track.html" class="text-gray-400 hover:text-gold flex flex-col items-center text-xs"><i class="fas fa-map-marked-alt text-base"></i> Jejak</a>
        <a href="rider.html" class="text-gray-400 hover:text-gold flex flex-col items-center text-xs"><i class="fas fa-motorcycle text-base"></i> Rider</a>
        <a href="admin.html" class="text-gray-400 hover:text-gold flex flex-col items-center text-xs"><i class="fas fa-user-shield text-base"></i> Admin</a>
    </nav>
</body>
</html>
