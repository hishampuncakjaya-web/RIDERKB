<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyRiderKu - Admin Login</title>
    <link rel="stylesheet" href="myriderku-ceria.css">
</head>
<body>
    <div class="container my-5" style="max-width: 450px;">
        <div class="card p-4">
            <h3 class="mb-3">Log Masuk Admin</h3>
            <form id="admin-login-form">
                <div class="mb-3">
                    <label>E-mel</label>
                    <input type="email" id="admin-email" class="form-control" value="mnhzuan@gmail.com" required>
                </div>
                <div class="mb-3">
                    <label>Kata Laluan</label>
                    <input type="password" id="admin-password" class="form-control" required>
                </div>
                <div id="login-error" class="text-danger mb-3" style="display:none;">E-mel atau kata laluan salah.</div>
                <button type="submit" class="btn btn-warning w-100">Log Masuk</button>
            </form>
        </div>
    </div>
    <script>
        // Admin login normalization & error handling fix
        document.getElementById('admin-login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('admin-email').value.trim().toLowerCase();
            const password = document.getElementById('admin-password').value;

            // Mock check for UAT admin
            if (email === "mnhzuan@gmail.com" && password.length >= 4) {
                alert("Admin berjaya log masuk! Mengalihkan ke Dashboard...");
                window.location.href = "admin.html#dashboard";
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        });
    </script>
</body>
</html>
